# Local development database.
# Run from this folder:  docker compose up -d
services:
  db:
    image: postgres:16
    container_name: orderdesk-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: orderdesk
      POSTGRES_PASSWORD: orderdesk_dev
      POSTGRES_DB: orderdesk
    ports:
      - "5432:5432"
    volumes:
      - orderdesk_pgdata:/var/lib/postgresql/data

volumes:
  orderdesk_pgdata:
